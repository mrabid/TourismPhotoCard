<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Tourism Day — Photo Card Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans+Bengali:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>World Tourism Day Photo Card</h1>
        <p>ছবি আপলোড করুন, নাম লিখুন এবং ডাউনলোড করুন</p>
      </header>

      <div class="workspace">
        <aside class="controls">
          <div class="control-group">
            <label for="photoInput">ছবি আপলোড</label>
            <input type="file" id="photoInput" accept="image/*" />
          </div>

          <div class="control-group">
            <label for="nameText">নাম (লাল বক্সে)</label>
            <input type="text" id="nameText" value="" placeholder="আপনার নাম লিখুন" />
          </div>

          <button type="button" id="downloadBtn" class="download-btn">
            PNG ডাউনলোড
          </button>
        </aside>

        <main class="preview-area">
          <canvas id="previewCanvas" class="preview-canvas" width="600" height="600"></canvas>
          <canvas id="exportCanvas" hidden width="1200" height="1200"></canvas>
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
