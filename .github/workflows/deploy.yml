name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish built site to main branch root
        run: |
          cp dist/index.source.html index.html
          rm -rf assets
          cp -r dist/assets assets
          cp dist/PRB-NEWS-Tempated.png PRB-NEWS-Tempated.png
          cp dist/.nojekyll .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets PRB-NEWS-Tempated.png .nojekyll
          git diff --staged --quiet || git commit -m "Deploy built site to GitHub Pages [skip ci]"
          git push
